<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCMS - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/dashboard.css">
<style>
  .project {
      border: 1px solid var(--border);
      padding: 15px;
      margin: 10px;
      cursor: pointer;
      transition: 0.3s;
      background: var(--surface2);
      border-radius: 8px;
      min-width: 200px;
  }
  .project:hover {
      background: var(--border);
      transform: translateY(-2px);
  }
  #modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
  }
  #modal-overlay.open { display: block; }
  #modal {
      background: var(--surface); color: var(--text);
      padding: 24px; width: 350px;
      margin: 100px auto; border-radius: 12px;
      box-shadow: var(--shadow-lg);
  }
  #modal input {
      width: 100%; padding: 10px; margin-bottom: 12px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface2); color: var(--text);
  }
  .btn {
      padding: 8px 16px; border: none; border-radius: 6px;
      cursor: pointer; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-cancel { background: var(--surface2); color: var(--text-sub); border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">O</span>
      <span class="logo-text">OpenCMS</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" id="nav-projects">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Projects</span>
      </div>
      <div class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Blogs</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">A</div>
        <div class="user-meta">
          <span class="user-name">Admin</span>
          <span class="user-role">Superuser</span>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-breadcrumb" id="breadcrumb">Dashboard / Projects</div>
      <div class="topbar-right">
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div class="content" id="main-content" style="padding: 24px; overflow-y: auto;">
       <!-- Projects will be dynamically injected here -->
    </div>
  </div>
</div>

<div id="modal-overlay">
    <div id="modal">
        <h3 style="margin-bottom:15px; margin-top: 0;">Add Project</h3>
        <input id="input-name" type="text" required placeholder="Project Title" />
        <input id="input-repo" type="text" required placeholder="Repo link (e.g. user/repo)" />
        <div style="display: flex; gap: 10px; margin-top: 10px;">
           <button class="btn btn-primary" id="btn-submit">Submit</button>
           <button class="btn btn-cancel" id="btn-cancel">Cancel</button>
        </div>
    </div>
</div>

<script>
    // Theme toggler
    document.getElementById("themeToggle").addEventListener("click", () => document.body.classList.toggle("dark"));
    
    // Load projects on link click
    document.getElementById("nav-projects").addEventListener("click", populateProjects);

    async function populateProjects() {
        const mainDiv = document.getElementById("main-content");
        document.getElementById("breadcrumb").textContent = "Dashboard / Projects";

        mainDiv.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h1 style="margin: 0; font-size: 24px;">Projects</h1>
                <button id="add-project-btn" class="btn btn-primary">+ Add Project</button>
            </div>
            <div id="projects-grid" style="display: flex; gap: 20px; flex-wrap: wrap;"></div>
        `;

        document.getElementById("add-project-btn").addEventListener("click", () => {
            document.getElementById("modal-overlay").classList.add("open");
        });

        try {
            const resp = await fetch("/projects");
            const result = await resp.json();
            const projects = result.message || [];
            
            const grid = document.getElementById("projects-grid");
            
            for (const proj of projects) {
                const card = document.createElement("div");
                card.className = "project";
                const projectId = proj._id || proj.id;
                
                card.innerHTML = `
                    <h3 style="margin: 0 0 8px 0; color: var(--text);">${proj.name}</h3>
                    <p style="margin: 0; font-size: 12px; color: var(--text-sub); word-break: break-all; font-family: monospace;">${proj.repo_link}</p>
                `;
                
                card.addEventListener("click", () => loadProjectDetails(proj.name, projectId));
                grid.appendChild(card);
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function loadProjectDetails(projectName, projectId) {
        const mainDiv = document.getElementById("main-content");
        document.getElementById("breadcrumb").textContent = "Dashboard / Projects / " + projectName;

        mainDiv.innerHTML = `
            <button id="back-btn" class="btn btn-cancel" style="margin-bottom: 20px;">&larr; Back to Projects</button>
            <h2 style="margin-top: 0; margin-bottom: 20px;">${projectName} Entries</h2>
            
            <div style="display: flex; gap: 20px; height: calc(100vh - 220px);">
                <div id="published-col" style="flex: 1; background: var(--surface2); padding: 20px; border-radius: 8px; border: 1px solid var(--border); overflow-y: auto;">
                    <h3 style="color: var(--success); border-bottom: 2px solid var(--success); padding-bottom: 10px; margin-top: 0; position: sticky; top: 0; background: var(--surface2); z-index: 1;">Published</h3>
                </div>
                <div id="drafts-col" style="flex: 1; background: var(--surface2); padding: 20px; border-radius: 8px; border: 1px solid var(--border); overflow-y: auto;">
                    <h3 style="color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-top: 0; position: sticky; top: 0; background: var(--surface2); z-index: 1;">Drafts</h3>
                </div>
            </div>
        `;

        document.getElementById("back-btn").addEventListener("click", populateProjects);

        try {
            const response = await fetch("/fieldposts/");
            if (!response.ok) throw new Error("Failed to fetch posts");

            const result = await response.json();
            const allPosts = result.message || [];
            const projectPosts = allPosts.filter(post => post.projectId === projectId);
            
            const publishedCol = document.getElementById("published-col");
            const draftsCol = document.getElementById("drafts-col");

            if (projectPosts.length === 0) {
                const noDataMsg = document.createElement("p");
                noDataMsg.textContent = "No entries found for this project.";
                noDataMsg.style.color = "var(--text-sub)";
                noDataMsg.style.fontSize = "13px";
                publishedCol.appendChild(noDataMsg.cloneNode(true));
                draftsCol.appendChild(noDataMsg);
                return;
            }

            projectPosts.forEach(post => {
                const postCard = document.createElement("div");
                postCard.style.background = "var(--surface)";
                postCard.style.padding = "15px";
                postCard.style.marginTop = "15px";
                postCard.style.borderRadius = "6px";
                postCard.style.border = "1px solid var(--border)";
                postCard.style.borderLeft = post.status === "published" ? "4px solid var(--success)" : "4px solid var(--accent)";
                
                const title = post.title || "Untitled Entry";
                postCard.innerHTML = `
                    <h4 style="margin: 0 0 5px 0; color: var(--text);">${title}</h4>
                    <span style="font-size: 12px; color: var(--text-sub); font-family: monospace;">Field ID: ${post.fieldId}</span>
                `;

                if (post.status === "published") {
                    publishedCol.appendChild(postCard);
                } else {
                    draftsCol.appendChild(postCard);
                }
            });
            
        } catch (err) {
            console.error("Error loading project details:", err);
            const errorMsg = document.createElement("p");
            errorMsg.style.color = "var(--danger)";
            errorMsg.textContent = "Failed to load entries.";
            document.getElementById("published-col").appendChild(errorMsg);
        }
    }

    // Modal Events
    document.getElementById("btn-submit").addEventListener("click", async () => {
        await fetch("/projects", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: document.getElementById("input-name").value,
                repo_link: document.getElementById("input-repo").value
            })
        });
        document.getElementById("modal-overlay").classList.remove("open");
        populateProjects(); // Refresh after adding
    });

    document.getElementById("btn-cancel").addEventListener("click", () => {
        document.getElementById("modal-overlay").classList.remove("open");
    });

    // Auto-load on start
    populateProjects();
</script>
</body>
</html>
