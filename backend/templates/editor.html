<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editor</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <style>
        #md-editor {
            display: none;
            width: 100%;
            height: 200px;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <button id="toggle-btn">Switch to Markdown</button>

    <!-- Rich text mode -->
    <div id="quill-editor"></div>

    <!-- Markdown mode -->
    <textarea id="md-editor"></textarea>

    <script>
        // ── Quill setup ──
        const quill = new Quill('#quill-editor', { theme: 'snow' })
        const mdEditor = document.getElementById('md-editor')
        const toggleBtn = document.getElementById('toggle-btn')
        let mode = 'rich'  // 'rich' or 'markdown'

        toggleBtn.addEventListener('click', () => {
            if (mode === 'rich') {
                // Rich → Markdown: convert Quill HTML to markdown, show textarea
                mdEditor.value = htmlToMarkdown(quill.root.innerHTML)
                document.getElementById('quill-editor').style.display = 'none'
                mdEditor.style.display = 'block'
                toggleBtn.textContent = 'Switch to Rich Text'
                mode = 'markdown'
            } else {
                // Markdown → Rich: convert textarea markdown to HTML, load into Quill
                quill.root.innerHTML = markdownToHtml(mdEditor.value)
                mdEditor.style.display = 'none'
                document.getElementById('quill-editor').style.display = 'block'
                toggleBtn.textContent = 'Switch to Markdown'
                mode = 'rich'
            }
        })

        // Get final content (always as Markdown)
        function getContent() {
            if (mode === 'rich') return htmlToMarkdown(quill.root.innerHTML)
            return mdEditor.value
        }

        // ── HTML → MARKDOWN (from richtext.html) ──
        function htmlToMarkdown(html) {
            const doc = new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html')
            return walkNode(doc.body).trim()
        }

        function walkNode(node) {
            if (node.nodeType === Node.TEXT_NODE) return node.textContent
            if (node.nodeType !== Node.ELEMENT_NODE) return ''

            const tag = node.tagName.toLowerCase()
            const inner = () => Array.from(node.childNodes).map(walkNode).join('')

            switch (tag) {
                case 'h1': return `\n# ${inner()}\n`
                case 'h2': return `\n## ${inner()}\n`
                case 'p':  return `\n${inner()}\n`
                case 'br': return '\n'
                case 'strong':
                case 'b': return `**${inner()}**`
                case 'em':
                case 'i': return `*${inner()}*`
                case 's':
                case 'strike': return `~~${inner()}~~`
                case 'blockquote': return `\n> ${inner().trim()}\n`
                case 'ul':
                    return '\n' + Array.from(node.children)
                        .map(li => `- ${walkNode(li).trim()}`).join('\n') + '\n'
                case 'ol':
                    return '\n' + Array.from(node.children)
                        .map((li, i) => `${i + 1}. ${walkNode(li).trim()}`).join('\n') + '\n'
                case 'li': return inner()
                default: return inner()
            }
        }

        // ── MARKDOWN → HTML (from richtext.html) ──
        function markdownToHtml(md) {
            const lines = md.split('\n')
            const out = []
            let i = 0

            while (i < lines.length) {
                const line = lines[i]
                const h1 = line.match(/^# (.+)/)
                const h2 = line.match(/^## (.+)/)

                if (h1) { out.push(`<h1>${inl(h1[1])}</h1>`); i++; continue }
                if (h2) { out.push(`<h2>${inl(h2[1])}</h2>`); i++; continue }

                if (line.startsWith('> ')) {
                    out.push(`<blockquote>${inl(line.slice(2))}</blockquote>`)
                    i++; continue
                }

                if (/^[-*+] /.test(line)) {
                    const items = []
                    while (i < lines.length && /^[-*+] /.test(lines[i])) {
                        items.push(`<li>${inl(lines[i].replace(/^[-*+] /, ''))}</li>`)
                        i++
                    }
                    out.push(`<ul>${items.join('')}</ul>`)
                    continue
                }

                if (/^\d+\. /.test(line)) {
                    const items = []
                    while (i < lines.length && /^\d+\. /.test(lines[i])) {
                        items.push(`<li>${inl(lines[i].replace(/^\d+\. /, ''))}</li>`)
                        i++
                    }
                    out.push(`<ol>${items.join('')}</ol>`)
                    continue
                }

                if (line.trim() === '') { out.push(''); i++; continue }

                out.push(`<p>${inl(line)}</p>`)
                i++
            }

            return out.join('\n')
        }

        function inl(t) {
            return t
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/~~(.+?)~~/g, '<strike>$1</strike>')
        }
    </script>

</body>
</html>
