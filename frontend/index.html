<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OpenCMS</title>

<style>

body{
font-family: Arial, sans-serif;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
border:2px solid black;
padding:30px;
}

h1{
text-align:center;
margin-bottom:40px;
}

.blog-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.blog-card{
border:2px solid black;
padding:15px;
}

.thumbnail{
width:100%;
height:150px;
border:1px solid black;
}

</style>
</head>

<body>

<div class="container">

<h1>Welcome to OpenCMS!</h1>

<div class="blog-grid">

<div class="blog-card">
<p>Blog 1</p>
<div class="thumbnail"></div>
</div>

<div class="blog-card">
<p>Blog 2</p>
<div class="thumbnail"></div>
</div>

<div class="blog-card">
<p>Blog 3</p>
<div class="thumbnail"></div>
</div>

<div class="blog-card">
<p>Blog 4</p>
<div class="thumbnail"></div>
</div>

<div class="blog-card">
<p>Blog 5</p>
<div class="thumbnail"></div>
</div>

<div class="blog-card">
<p>Blog 6</p>
<div class="thumbnail"></div>
</div>

</div>

</div>

</body>
</html>
